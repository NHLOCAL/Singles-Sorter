[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singlesorter"
version = "14.0.1"
description = "Singles Sorter CLI for organizing music by artist"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NHLOCAL", email = "nh.local11@gmail.com" }]
keywords = ["music", "organizer", "cli", "sorter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "music-tag>=0.4.3",
]

[project.optional-dependencies]
gui = [
  "flet[all]==0.85.3",
  "flet-permission-handler==0.85.3",
]
ai = [
  "scikit-learn>=1.5.1,<1.6",
  "spacy>=3.7.5,<3.8",
]
dev = [
  "build>=1.2.2",
  "pytest>=8.3.4",
  "ruff>=0.9.0",
  "twine>=6.1.0",
]

[project.urls]
Homepage = "https://github.com/NHLOCAL/Singles-Sorter"
Repository = "https://github.com/NHLOCAL/Singles-Sorter"
Issues = "https://github.com/NHLOCAL/Singles-Sorter/issues"

[project.scripts]
singlesorter = "singlesorter.cli:main"
singlesorter-gui = "singlesorter_gui.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["singlesorter*"]

[tool.setuptools.package-data]
singlesorter = [
  "data/*.csv",
  "models/version",
  "models/music_entity_clf/*.json",
  "models/music_entity_clf/*.pkl",
  "models/singer_ner_he/*.cfg",
  "models/singer_ner_he/*.json",
  "models/singer_ner_he/tokenizer",
  "models/singer_ner_he/ner/*",
  "models/singer_ner_he/vocab/*",
]
singlesorter_gui = ["assets/*.png", "content/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  "legacy",
  "src/core",
  "src/features",
  "src/models",
  "src/tests",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.flet.app]
path = "src"
module = "main"

[tool.flet]
org = "top.zekal"
product = "מסדר הסינגלים"
company = "NH.LOCAL"
copyright = "Copyright © 2026 NH.LOCAL"

[tool.flet.android]
dependencies = [
  "flet==0.85.3",
  "flet-permission-handler==0.85.3",
]
source_packages = ["music-tag"]
split_per_abi = true
min_sdk_version = 24
adaptive_icon_background = "#F5C518"

[tool.flet.android.app]
exclude = ["core", "features", "models", "singlesorter/models", "tests", "tasks"]

[tool.flet.android.permission]
"android.permission.READ_MEDIA_AUDIO" = true
"android.permission.READ_EXTERNAL_STORAGE" = { maxSdkVersion = "32" }
"android.permission.WRITE_EXTERNAL_STORAGE" = { maxSdkVersion = "32" }
"android.permission.MANAGE_EXTERNAL_STORAGE" = true

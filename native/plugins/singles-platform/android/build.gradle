buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:9.3.3'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20' }
}
apply plugin: 'com.android.library'
repositories { google(); mavenCentral() }
android {
    namespace 'com.nhlocal.singlesorter.platform'
    compileSdk 37
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

[package]
name = "singles-android-inference"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
[workspace]
resolver = "3"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
sorter-io = { path = "../../crates/sorter-io", optional = true }
sha2 = { version = "0.10", optional = true }
libc = { version = "0.2", optional = true }
jni = "=0.21.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
sorter-recognition = { path = "../../crates/sorter-recognition" }
sorter-core = { path = "../../crates/sorter-core" }

[features]
product = ["dep:sorter-io", "dep:sha2", "dep:libc"]

[workspace]
members = ["crates/sorter-core", "crates/sorter-cli", "crates/sorter-io", "crates/sorter-executor", "crates/sorter-storage-contracts", "crates/sorter-classifier", "crates/sorter-recognition"]
resolver = "3"
exclude = ["probes/released-ner/released-ner-text", "probes/released-ner/released-ner-math"]

[workspace.package]
version = "15.0.0-beta.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
sha2 = "0.10"
sorter-core = { path = "crates/sorter-core" }
sorter-storage-contracts = { path = "crates/sorter-storage-contracts" }

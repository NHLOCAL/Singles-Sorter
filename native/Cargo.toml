[workspace]
members = ["crates/sorter-core", "crates/sorter-cli", "crates/sorter-io"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
sha2 = "0.10"
sorter-core = { path = "crates/sorter-core" }

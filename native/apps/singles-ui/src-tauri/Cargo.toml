[package]
name = "singles-ui-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

# Deliberately independent from the CLI workspace: desktop dependencies do not
# increase the standalone CLI's build/runtime requirements.
[workspace]
resolver = "3"

[features]
default = ["desktop"]
original-ai = ["dep:sorter-recognition"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]

[[bin]]
name = "singles-sorter-preview"
path = "src/main.rs"
required-features = ["desktop"]

[lib]
name = "singles_ui_host"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
encoding_rs = "=0.8.42"
tempfile = "=3.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
sha2 = "0.10"
sorter-recognition = { path = "../../../crates/sorter-recognition", optional = true }
sorter-core = { path = "../../../crates/sorter-core" }
sorter-io = { path = "../../../crates/sorter-io" }
tauri-plugin-opener = { version = "=2.7.1", optional = true }
tauri = { version = "=2.12.3", features = [], optional = true }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-dialog = { version = "=2.8.2", optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Wdk_Storage_FileSystem"] }

name: Original NER isolated platform proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/probes/released-ner/**'
      - '.github/workflows/released-ner-platform.yml'
permissions:
  contents: read
concurrency:
  group: original-ner-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: native/probes/released-ner
    steps:
      - name: Preserve exact source bytes on Windows and Linux
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: native/probes/released-ner
      - name: Read exact original assets from existing repository baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NHLOCAL/Singles-Sorter
          ref: 78d001aee5ce49628bdffebd34540fa83ba32c12
          path: original-baseline
          persist-credentials: false
          sparse-checkout: src/core/models/singer_ner_he
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Install oracle-only Python dependencies
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check numpy==1.26.4 spacy==3.7.5 thinc==8.2.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze
      - name: Verify exact source assets and export only owned synthetic fixtures
        run: |
          python released-ner-export/export.py --model "$env:GITHUB_WORKSPACE/original-baseline/src/core/models/singer_ner_he" --out .oracle --suite platform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python released-ner-export/verify.py .oracle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check acquisition failures without downloads
        run: python test_acquisition.py
      - name: Build verified official PCRE2-32 static source without JIT
        run: |
          python acquire_pcre2.py --out .pcre2 --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PCRE2_STATIC_DIR=$((Resolve-Path .pcre2/install/lib).Path)" >> $env:GITHUB_ENV
      - name: Install pinned official Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare independently preserved original scalar baseline
        run: |
          python test_baseline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python prepare_baseline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test isolated crates and build native proof executables
        run: |
          cargo +1.99.0 test --locked --manifest-path released-ner-text/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 test --locked --manifest-path released-ner-math/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 build --locked --release --manifest-path released-ner-text/Cargo.toml --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 build --locked --release --manifest-path released-ner-math/Cargo.toml --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build original scalar comparison with the same pinned dependency
        run: |
          cargo +1.99.0 build --locked --release --manifest-path .baseline/released-ner-text/Cargo.toml --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 build --locked --release --manifest-path .baseline/released-ner-math/Cargo.toml --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require same-host optimization bits, diagnostics, modes and errors
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          python check_optimization.py --bundle .oracle --baseline "./.baseline/released-ner-text/target/release/raw-ner$ext" --optimized "./released-ner-text/target/release/raw-ner$ext" --baseline-stages "./.baseline/released-ner-math/target/release/stage-bits$ext" --optimized-stages "./released-ner-math/target/release/stage-bits$ext"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require original numeric states and exact cross-platform paths
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          & "./released-ner-math/target/release/released-ner-probe$ext" .oracle > .oracle/numeric-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python check_platform.py --bundle .oracle --raw "./released-ner-text/target/release/raw-ner$ext" --lexical "./released-ner-text/target/release/released-ner-text$ext"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content .pcre2/build-receipt.json
      # No artifact uploads: original model bytes and generated oracle arrays stay job-local.
      # No production package, application dependency, publication, or deployment step.

name: Release version 15

# A v15 tag runs every acceptance workflow, then assembles a DRAFT GitHub release.
# Publishing the draft stays a deliberate manual step.
on:
  push:
    tags:
      - 'v15.*'
  workflow_dispatch:
  # Add the full-acceptance label to a PR to run this once before tagging.
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  identity:
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-acceptance'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      app_id: ${{ steps.read.outputs.app_id }}
      certificate: ${{ steps.read.outputs.certificate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require one consistent version everywhere
        id: read
        run: python3 native/packaging/windows-installer/check_release_identity.py

  native:
    needs: identity
    uses: ./.github/workflows/native-ci.yml

  windows-desktop:
    needs: identity
    uses: ./.github/workflows/native-ui-windows.yml

  windows-cli:
    needs: identity
    uses: ./.github/workflows/original-ai-cli.yml

  android:
    needs: identity
    uses: ./.github/workflows/android-product.yml
    with:
      release_signing: true
    secrets: inherit

  assemble:
    needs: [identity, native, windows-desktop, windows-cli, android]
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.identity.outputs.version }}
      APP_ID: ${{ needs.identity.outputs.app_id }}
      CERTIFICATE: ${{ needs.identity.outputs.certificate }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download accepted artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/accepted
          pattern: '*-${{ github.sha }}'

      - name: Verify checksums and signing receipt, then name release assets
        run: |
          $accepted = Join-Path $env:RUNNER_TEMP 'accepted'
          $out = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force $out | Out-Null
          function Accepted($artifact, $zip) {
            $path = Join-Path $accepted "$artifact-$env:GITHUB_SHA/$zip"
            $expected = ((Get-Content "$path.sha256" -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Checksum mismatch: $zip" }
            return $path
          }
          $desktop = Accepted 'original-ai-windows-x64-selected-desktop' 'singles-sorter-original-ai-windows-x64-selected-desktop.zip'
          $cli = Accepted 'original-ai-windows-x64-cli-preview' 'singles-sorter-original-ai-windows-x64-selected-cli.zip'
          Copy-Item $desktop (Join-Path $out "Singles-Sorter-Portable-$env:VERSION.zip")
          Copy-Item $cli (Join-Path $out "Singles-Sorter-CLI-$env:VERSION.zip")
          $android = Join-Path $accepted "singles-sorter-15-android-$env:GITHUB_SHA"
          $receipt = Get-Content (Join-Path $android "Singles-Sorter-$env:VERSION.signing.json") -Raw | ConvertFrom-Json
          $apk = Join-Path $android "Singles-Sorter-$env:VERSION.apk"
          if ($receipt.qa_only -or $receipt.certificate_sha256 -ne $env:CERTIFICATE) { throw 'APK is not signed by the permanent identity' }
          if ((Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant() -ne $receipt.apk_sha256) { throw 'APK does not match its signing receipt' }
          Copy-Item $apk $out
          $package = Join-Path $env:RUNNER_TEMP 'desktop-package'
          Expand-Archive $desktop -DestinationPath $package
          $exe = Get-ChildItem $package -Recurse -Filter 'singles-sorter-preview.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Desktop executable missing from accepted package' }
          "PACKAGE_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
          "RELEASE_DIR=$out" >> $env:GITHUB_ENV

      - name: Build the installer from the accepted package
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$env:VERSION" "/DMyAppId=$env:APP_ID" "/DPackageDir=$env:PACKAGE_DIR" "/DOutputDir=$env:RELEASE_DIR" "/DRepoRoot=$env:GITHUB_WORKSPACE" native/packaging/windows-installer/singles-sorter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install, verify and uninstall as a normal user
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'installed app'
          $setup = Join-Path $env:RELEASE_DIR "Singles-Sorter-Installer-$env:VERSION.exe"
          $process = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exit $($process.ExitCode)" }
          foreach ($file in 'singles-sorter-preview.exe','models/original/manifest.json') {
            if (-not (Test-Path (Join-Path $target $file))) { throw "Installed file missing: $file" }
          }
          $process = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller exit $($process.ExitCode)" }

      - name: Publish checksums and retain assets
        run: |
          Set-Location $env:RELEASE_DIR
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: singles-sorter-release-${{ github.sha }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Create the draft release for a tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = Join-Path $env:GITHUB_WORKSPACE 'native/packaging/windows-installer/release-notes.md'
          gh release create $env:GITHUB_REF_NAME --draft --title "מסדר הסינגלים $env:VERSION" --notes-file $notes (Get-ChildItem $env:RELEASE_DIR -File).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

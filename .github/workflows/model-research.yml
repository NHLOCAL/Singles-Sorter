name: Model research utility checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'machine-learn/research/**'
      - '.github/workflows/model-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-utilities:
    name: Synthetic research checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: machine-learn/research
      - name: Set up official Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Test utilities with owned synthetic fixtures only
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s machine-learn/research/tests -v
          python -O -m unittest discover -s machine-learn/research/tests -v

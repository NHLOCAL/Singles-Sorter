name: Android inference bridge host guards
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/plugins/original-inference/**'
      - 'native/crates/sorter-recognition/**'
      - '.github/workflows/android-inference-bridge.yml'
permissions:
  contents: read
jobs:
  host-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and static PCRE2 tooling
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          python3 native/probes/released-ner/acquire_pcre2.py --out "$RUNNER_TEMP/bridge-pcre2" --build
          echo "PCRE2_STATIC_DIR=$RUNNER_TEMP/bridge-pcre2/install/lib" >> "$GITHUB_ENV"
      - name: Check bridge host bounds and ownership (not Android execution)
        working-directory: native/plugins/original-inference
        run: |
          cargo fmt --check
          cargo test --locked --lib
          cargo clippy --locked --all-targets -- -D warnings
          bash -n android/build-fixture.sh

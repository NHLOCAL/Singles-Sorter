name: Original-only AI CLI release proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/original-ai-cli.yml'

permissions:
  contents: read

concurrency:
  group: original-ai-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-proof:
    name: Original models and real-file CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: native
    steps:
      - name: Keep authenticated source bytes identical on both platforms
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out reviewed native sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: native

      - name: Read only the pinned public original baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NHLOCAL/Singles-Sorter
          ref: 78d001aee5ce49628bdffebd34540fa83ba32c12
          path: original-baseline
          persist-credentials: false
          sparse-checkout: src/core

      - name: Install pinned oracle Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'

      - name: Install authenticated oracle-only packages
        run: |
          python -m pip install --only-binary=:all: --require-hashes --disable-pip-version-check -r probes/released-ner/oracle-requirements.txt -r crates/sorter-classifier/tools/oracle-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # music-tag has no official wheel; only this hash-pinned source package
          # is built, using the already pinned setuptools backend without isolation.
          python -m pip install --no-build-isolation --require-hashes --disable-pip-version-check -r tests/original_ai_cli/metadata-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/released-ner/check_oracle_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze

      - name: Verify exporters and regenerate only exact original assets
        run: |
          python -O crates/sorter-classifier/tools/test_export_auth.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/original_ai_cli -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/released-ner/released-ner-export/export.py --model "$env:GITHUB_WORKSPACE/original-baseline/src/core/models/singer_ner_he" --out target/original-ai/bundle --suite platform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/released-ner/released-ner-export/verify.py target/original-ai/bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/released-ner/check_oracle_golden.py target/original-ai/bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python crates/sorter-classifier/tools/export_original.py --baseline "$env:GITHUB_WORKSPACE/original-baseline" --output target/original-ai/bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build authenticated static PCRE2 archive without JIT
        run: |
          python probes/released-ner/acquire_pcre2.py --out target/original-ai/pcre2 --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PCRE2_STATIC_DIR=$((Resolve-Path target/original-ai/pcre2/install/lib).Path)" >> $env:GITHUB_ENV
          # Windows uses the dynamic MSVC CRT consistently in PCRE2, TagLib and
          # Rust. PCRE2, TagLib and zlib themselves are linked as static archives.

      - name: Install pinned official Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check original AI feature and workspace contracts
        run: |
          cargo +1.99.0 fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 clippy --locked --workspace --all-targets --features sorter-cli/original-ai -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 test --locked --release --workspace --features sorter-cli/original-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build default-off CLI and explicit original-only CLI in application release profile
        run: |
          cargo +1.99.0 build --locked --release -p sorter-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ext = if ($IsWindows) { '.exe' } else { '' }
          Copy-Item "target/release/singles-sorter$ext" "target/original-ai/default-cli$ext"
          cargo +1.99.0 build --locked --release -p sorter-cli --features original-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 build --locked --release -p sorter-classifier --example parity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare original classifier numeric oracle at application optimization level
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          python crates/sorter-classifier/tools/verify_original.py --assets target/original-ai/bundle --binary "target/release/examples/parity$ext" --evidence target/original-ai/classifier-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare original NER paths and exercise shared bounded adapter
        run: |
          $env:ORIGINAL_AI_BUNDLE = (Resolve-Path target/original-ai/bundle).Path
          $env:ORIGINAL_NER_ORACLE = (Resolve-Path target/original-ai/bundle/fixtures.json).Path
          cargo +1.99.0 test --locked --release -p sorter-recognition --test original_oracle -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run actual release CLI against original routes on authored real audio
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          python tests/original_ai_cli/check_cli.py --binary "target/release/singles-sorter$ext" --disabled-binary "target/original-ai/default-cli$ext" --bundle target/original-ai/bundle --baseline "$env:GITHUB_WORKSPACE/original-baseline" --report target/original-ai/cli-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content target/original-ai/pcre2/build-receipt.json

      # No artifact upload or release publication. Original model bytes, source
      # pickle, generated numeric arrays and synthetic reports stay job-local.
      # No candidate model, model download at CLI runtime, or physical apply.

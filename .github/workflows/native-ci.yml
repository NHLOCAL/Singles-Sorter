name: Native read-only preview CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'native/**'
      - '.github/workflows/native-ci.yml'

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust 1.99.0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: native
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: native

      - name: Install pinned official Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy

      - name: Verify toolchain
        run: |
          rustup run 1.99.0 rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 --version

      - name: Test pinned dependency acquisition and offline cache
        run: |
          python tests/build/test_dependency_acquisition.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/build/test_dependency_failure_containment.py

      - name: Build pinned static PCRE2 for original adapter workspace tests
        run: |
          python probes/released-ner/acquire_pcre2.py --out probes/released-ner/.pcre2 --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PCRE2_STATIC_DIR=$((Resolve-Path probes/released-ner/.pcre2/install/lib).Path)" >> $env:GITHUB_ENV

      - name: Check formatting
        run: cargo +1.99.0 fmt --all -- --check

      - name: Check all targets with Clippy
        run: cargo +1.99.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test native contracts and JSON subprocess protocol
        run: cargo +1.99.0 test --locked --workspace

      - name: Check experimental Windows mutation contracts
        if: runner.os == 'Windows'
        run: cargo +1.99.0 clippy --locked -p sorter-io --features experimental-windows-mutation --all-targets -- -D warnings

      - name: Exercise handle-bound mutation on owned Windows NTFS fixtures
        if: runner.os == 'Windows'
        run: |
          $listing = cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --test windows_storage -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @($listing | Where-Object { $_ -match ': test$' })
          if ($cases.Count -ne 12) { throw "Expected all 12 native Windows fixture cases; found $($cases.Count)" }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --test windows_storage -- --test-threads=1

      - name: Check experimental Windows journal bridge
        if: runner.os == 'Windows'
        run: cargo +1.99.0 clippy --locked -p sorter-executor --features experimental-windows-journal --all-targets -- -D warnings

      - name: Exercise native journal flush errors and close/reopen recovery
        if: runner.os == 'Windows'
        run: |
          $listing = cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-journal --test windows_journal -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @($listing | Where-Object { $_ -match ': test$' })
          if ($cases.Count -ne 6) { throw "Expected all 6 native journal fixture cases; found $($cases.Count)" }
          cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-journal --test windows_journal -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $flushListing = cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib journal_flush_tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $flushCases = @($flushListing | Where-Object { $_ -match ': test$' })
          if ($flushCases.Count -ne 1) { throw "Expected the native rejected-flush test; found $($flushCases.Count)" }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib journal_flush_tests -- --test-threads=1

      - name: Check and exercise owned Windows single-file Copy
        if: runner.os == 'Windows'
        run: |
          cargo +1.99.0 clippy --locked -p sorter-executor --features experimental-windows-copy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listing = cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-copy --test windows_copy -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @($listing | Where-Object { $_ -match ': test$' })
          if ($cases.Count -ne 8) { throw "Expected all 8 owned Windows Copy fixture cases; found $($cases.Count)" }
          cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-copy --test windows_copy -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-copy

      - name: Test native metadata with static Windows CRT
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo +1.99.0 test --locked -j 2 --release -p sorter-io --test metadata_reference --test metadata_errors

      - name: Build native release executable
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo +1.99.0 build --locked --release -p sorter-cli

      - name: Smoke release executable in Hebrew path and unrelated CWD
        run: |
          @'
          import hashlib
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          native = Path.cwd()
          suffix = ".exe" if __import__("os").name == "nt" else ""
          fixtures = native / "tests" / "fixtures" / "protocol"

          def manifest(root):
              return sorted((str(p.relative_to(root)), p.is_dir(),
                             hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else "")
                            for p in root.rglob("*"))

          with tempfile.TemporaryDirectory(prefix="singles-native-smoke-") as temporary:
              root = Path(temporary)
              executable_dir = root / "תיקיית תוכנה"
              executable_dir.mkdir()
              executable = executable_dir / ("מסדר סינגלים" + suffix)
              shutil.copy2(native / "target" / "release" / ("singles-sorter" + suffix), executable)
              cwd = root / "unrelated-cwd"
              cwd.mkdir()
              source = root / "מקור"
              target = root / "יעד"
              source.mkdir()
              target.mkdir()
              song = source / "אמן - שיר.mp3"
              song.write_bytes(b"source sentinel\x00\xff")
              (target / "existing.mp3").write_bytes(b"target sentinel")
              before = manifest(root)

              def invoke(command, data=b"", expected_exit=0, expected_code=None):
                  process = subprocess.run([str(executable), command, "--json"], input=data,
                                           stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                           cwd=cwd, timeout=30, check=False)
                  assert process.returncode == expected_exit, (command, process)
                  response = json.loads(process.stdout.decode("utf-8"))
                  assert process.stdout.endswith(b"\n")
                  assert response["schema_version"] == 1
                  assert response["result"]["inference_executed"] is False
                  assert response["result"]["executable"] is False
                  if expected_code is None:
                      assert response["status"] == "ok" and response["error"] is None
                      assert process.stderr == b""
                  else:
                      assert response["status"] == "error"
                      assert response["error"]["code"] == expected_code
                  return response

              classified = invoke("classify", (fixtures / "classify-alias.json").read_bytes())
              assert classified["result"]["decision"]["artists"] == ["אמן ראשון"]
              request = json.loads((fixtures / "plan-collisions.json").read_text(encoding="utf-8"))
              request["songs"][0]["source_id"] = str(song)
              request["target"]["root_id"] = str(target)
              payload = json.dumps(request, ensure_ascii=False).encode("utf-8")
              planned = invoke("plan", payload)
              assert planned["result"]["plan"]["executable"] is False
              capabilities = invoke("capabilities")["result"]["capabilities"]
              assert capabilities["native_inference"] is False
              assert capabilities["physical_apply"] is False
              invoke("classify", b"{", 2, "INVALID_INPUT")
              invoke("apply", payload, 3, "UNSUPPORTED_CAPABILITY")
              assert manifest(root) == before, "all source/target paths and file hashes must survive"
          print("Native release smoke passed: Hebrew executable path, unrelated CWD, UTF-8, and unchanged sentinels")
          '@ | python -

      - name: Check Windows PowerShell 5.1 UTF-8 native pipeline
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw "This regression must run under Windows PowerShell 5.1"
          }
          $exe = (Resolve-Path 'target/release/singles-sorter.exe').Path
          # ASCII-only script literals also work without a UTF-8 script BOM in PS 5.1.
          $artist = [regex]::Unescape('\u05d0\u05de\u05df \u05e8\u05d0\u05e9\u05d5\u05df')
          $folder = [regex]::Unescape('\u05e1\u05d9\u05e0\u05d2\u05dc\u05d9\u05dd')
          $name = [regex]::Unescape('\u05d0\u05de\u05df - \u05e9\u05d9\u05e8')
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          foreach ($command in @('classify', 'plan')) {
            $fixture = if ($command -eq 'classify') { 'classify-alias.json' } else { 'plan-collisions.json' }
            $path = Join-Path 'tests/fixtures/protocol' $fixture
            $OutputEncoding = [System.Text.Encoding]::ASCII
            $prefix = Get-Content -LiteralPath $path -Raw -Encoding utf8 |
              python -c "import sys; print(sys.stdin.buffer.read()[:3].hex())"
            if ($LASTEXITCODE -ne 0) { throw 'ASCII stdin byte probe failed' }
            if ($prefix -notlike '7b*') { throw 'ASCII native stdin must start with {, without a BOM' }
            $previousErrorPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $brokenJson = Get-Content -LiteralPath $path -Raw -Encoding utf8 | & $exe $command --json 2>$null
              $brokenExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousErrorPreference
            }
            if ($brokenExit -ne 2) { throw "ASCII-corrupted $command must fail with exit 2" }
            $broken = $brokenJson | ConvertFrom-Json
            if ($broken.status -ne 'error' -or $broken.error.code -ne 'INVALID_INPUT' -or
                $broken.error.message -notlike 'Supplied title sanitizes to no string*') {
              throw "ASCII-corrupted $command did not reproduce the input encoding error: $brokenJson"
            }
            $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
            $prefix = Get-Content -LiteralPath $path -Raw -Encoding utf8 |
              python -c "import sys; print(sys.stdin.buffer.read()[:3].hex())"
            if ($LASTEXITCODE -ne 0) { throw 'UTF-8 stdin byte probe failed' }
            if ($prefix -notlike '7b*') { throw 'UTF-8 native stdin must start with {, without a BOM' }
            $json = Get-Content -LiteralPath $path -Raw -Encoding utf8 | & $exe $command --json
            if ($LASTEXITCODE -ne 0) { throw "UTF-8 $command failed: $json" }
            $response = $json | ConvertFrom-Json
            if ($response.status -ne 'ok' -or $response.schema_version -ne 1 -or
                $null -ne $response.error -or $response.result.inference_executed -ne $false -or
                $response.result.executable -ne $false) { throw "Invalid UTF-8 $command envelope" }
            if ($command -eq 'classify') {
              if (@($response.result.decision.artists).Count -ne 1 -or
                  $response.result.decision.artists[0] -cne $artist) { throw 'Hebrew artist changed' }
            } else {
              $plan = $response.result.plan
              if ($plan.executable -ne $false -or @($plan.items).Count -ne 2) { throw 'Invalid plan' }
              for ($i = 0; $i -lt 2; $i++) {
                $item = $plan.items[$i]
                if (@($item.destinations).Count -ne 1) { throw 'Unexpected destination count' }
                $parts = $item.destinations[0].components
                $expectedName = $name + '_' + ($i + 1) + '.mp3'
                if (@($parts).Count -ne 3 -or $parts[0] -cne $artist -or
                    $parts[1] -cne $folder -or $parts[2] -cne $expectedName) {
                  throw 'Hebrew plan components or collision suffixes changed'
                }
              }
            }
          }
          Write-Output 'Windows PowerShell 5.1 native pipeline passed: ASCII failure and UTF-8 Hebrew classify/plan'

      - name: Record Windows preview checksum and provenance
        if: runner.os == 'Windows'
        env:
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          @'
          import hashlib
          import os
          from pathlib import Path
          import subprocess

          release = Path("target/release")
          binary = release / "singles-sorter.exe"
          data = binary.read_bytes()
          assert data[:2] == b"MZ", "preview must be the native Windows executable"
          digest = hashlib.sha256(data).hexdigest()
          (release / "SHA256SUMS.txt").write_text(f"{digest}  singles-sorter.exe\n", encoding="utf-8")
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          rust = subprocess.check_output(["rustup", "run", "1.99.0", "rustc", "--version"], text=True).strip()
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          provenance = [
              "Singles-Sorter unsigned Windows x64 native preview CLI",
              f"Repository: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}",
              f"PR head: {os.environ['PREVIEW_HEAD_SHA']}",
              f"Tested checkout (PR merge): {checkout}",
              f"Toolchain: {rust}",
              "Runtime: Windows 10+ x64; MSVC C runtime linked statically.",
              f"Workflow run: {run_url}",
              f"EXE SHA256: {digest}",
              "Windows formatting, Clippy, workspace tests, release build, and portable smoke passed.",
              "Supplied-facts v1 classify/plan and read-only real-file v2 plan-files; every plan is non-executable.",
              "Frozen synthetic metadata coverage only; no GUI, real inference, tag writes, or physical apply.",
              "Quick PowerShell checks: .\\singles-sorter.exe --help",
              "                         .\\singles-sorter.exe capabilities --json",
              "No Rust or Python installation is needed to run this EXE.",
          ]
          (release / "PREVIEW.txt").write_text("\n".join(provenance) + "\n", encoding="utf-8")
          '@ | python -

      - name: Upload tested Windows preview CLI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: singles-sorter-windows-preview-${{ github.run_attempt }}
          path: |
            native/target/release/singles-sorter.exe
            native/target/release/SHA256SUMS.txt
            native/target/release/PREVIEW.txt
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false

  metadata-sanitizers:
    name: Native metadata ASan, UBSan and leak checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - name: Check out reviewed native sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: native

      - name: Build finite owned ABI sanitizer harness
        run: |
          cmake -S crates/sorter-io/bridge -B target/metadata-sanitizers \
            -DSORTER_BRIDGE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build target/metadata-sanitizers --target sorter_bridge_tests --parallel 2

      - name: Exercise all frozen media, truncations and deterministic malformed inputs
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import subprocess
          root = Path("tests/fixtures/media")
          files = [str(root / line.split("  ", 1)[1].removeprefix("fixtures/"))
                   for line in (root / "fixtures.sha256").read_text().splitlines() if line]
          assert len(files) == 60 and all(Path(f).is_file() for f in files)
          subprocess.run(["target/metadata-sanitizers/sorter_bridge_tests", *files],
                         check=True, timeout=300)
          PYCODE

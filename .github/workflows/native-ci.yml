          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --lib copy_metadata_ -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($cases | Where-Object { $_ -match ": test$" }).Count -ne 6) { throw "Expected 6 cases for --lib copy_metadata_" }
          cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --lib copy_metadata_ -- --test-threads=1

name: Native read-only preview CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'native/**'
      - '.github/workflows/native-ci.yml'

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust 1.99.0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: native
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: native

      - name: Install pinned official Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy

      - name: Verify toolchain
        run: |
          rustup run 1.99.0 rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 --version

      - name: Require FFmpeg for owned Ogg decoder comparisons
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            if ($IsWindows) {
              choco install ffmpeg --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } elseif ($IsLinux) {
              sudo apt-get update
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              sudo apt-get install --yes ffmpeg
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else { throw "Unsupported decoder-test runner" }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw "FFmpeg must be available; decoder tests cannot be skipped" }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test all-scope formatter diagnostic orchestration
        run: python tests/build/test_rust_format_diagnostics.py

      - name: Check every Rust scope and collect formatter diagnostics
        run: python tests/build/capture_rust_format.py --out ../native-formatting

      - name: Upload formatter diagnostics from all Rust scopes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-formatting-${{ matrix.os }}
          path: native-formatting/
          if-no-files-found: error

      - name: Preflight exact native owned-Copy fixture binding
        if: runner.os == 'Windows'
        run: |
          $listing = cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-copy --test windows_copy exact_unicode_copy_preserves_source_and_reopens_read_only -- --exact --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @($listing | Where-Object { $_ -match ': test$' })
          if ($cases.Count -ne 1) { throw "Expected the exact native owned-Copy preflight; found $($cases.Count)" }
          cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-copy --test windows_copy exact_unicode_copy_preserves_source_and_reopens_read_only -- --exact --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test pinned dependency acquisition and offline cache
        run: |
          python tests/build/test_dependency_acquisition.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/build/test_dependency_failure_containment.py

      - name: Build pinned static PCRE2 for original adapter workspace tests
        run: |
          python probes/released-ner/acquire_pcre2.py --out probes/released-ner/.pcre2 --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PCRE2_STATIC_DIR=$((Resolve-Path probes/released-ner/.pcre2/install/lib).Path)" >> $env:GITHUB_ENV

      - name: Check formatting
        run: cargo +1.99.0 fmt --all -- --check

      - name: Verify bounded official zlib acquisition
        if: runner.os == 'Linux'
        run: |
          python tests/build/test_acquire_zlib.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/build/acquire_zlib.py --evidence test-results/zlib-acquisition

      - name: Retain exact zlib acquisition response receipts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zlib-acquisition-native-${{ matrix.os }}-${{ github.run_attempt }}
          path: native/test-results/zlib-acquisition
          if-no-files-found: ignore
          retention-days: 7

      - name: Check all targets with Clippy
        run: cargo +1.99.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test native contracts and JSON subprocess protocol
        run: cargo +1.99.0 test --locked --workspace

      - name: Check experimental Windows mutation contracts
        if: runner.os == 'Windows'
        run: cargo +1.99.0 clippy --locked -p sorter-io --features experimental-windows-mutation --all-targets -- -D warnings

      - name: Exercise handle-bound mutation on owned Windows NTFS fixtures
        if: runner.os == 'Windows'
        run: |
          $listing = cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --test windows_storage -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @($listing | Where-Object { $_ -match ': test$' })
          if ($cases.Count -ne 12) { throw "Expected all 12 native Windows fixture cases; found $($cases.Count)" }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --test windows_storage -- --test-threads=1

      - name: Test pinned legacy diagnostic log sink
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $cases = cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib diagnostic_log_tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($cases | Where-Object { $_ -match ": test$" }).Count -ne 8) { throw "Expected 8 diagnostic log cases" }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib diagnostic_log_tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check experimental Windows journal bridge
        if: runner.os == 'Windows'
        run: cargo +1.99.0 clippy --locked -p sorter-executor --features experimental-windows-journal --all-targets -- -D warnings

      - name: Exercise verified held-publication file sync
        if: runner.os == 'Windows'
        run: |
          $listing = cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib published_sync_tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @($listing | Where-Object { $_ -match ': test$' })
          if ($cases.Count -ne 6) { throw "Expected all 6 native published-sync cases; found $($cases.Count)" }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib published_sync_tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native journal flush errors and close/reopen recovery
        if: runner.os == 'Windows'
        run: |
          $listing = cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-journal --test windows_journal -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @($listing | Where-Object { $_ -match ': test$' })
          if ($cases.Count -ne 6) { throw "Expected all 6 native journal fixture cases; found $($cases.Count)" }
          cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-journal --test windows_journal -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $flushListing = cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib journal_flush_tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $flushCases = @($flushListing | Where-Object { $_ -match ': test$' })
          if ($flushCases.Count -ne 1) { throw "Expected the native rejected-flush test; found $($flushCases.Count)" }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib journal_flush_tests -- --test-threads=1

      - name: Check and exercise owned Windows single-file Copy
        if: runner.os == 'Windows'
        run: |
          cargo +1.99.0 clippy --locked -p sorter-executor --features experimental-windows-copy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listing = cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-copy --test windows_copy -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @($listing | Where-Object { $_ -match ': test$' })
          if ($cases.Count -ne 9) { throw "Expected all 9 owned Windows Copy fixture cases; found $($cases.Count)" }
          cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-copy --test windows_copy -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-copy

      - name: Exercise owned Windows write-through rename-only Move
        if: runner.os == 'Windows'
        run: |
          cargo +1.99.0 clippy --locked -p sorter-executor --features experimental-windows-rename --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $primitiveListing = cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib rename_guard_tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $primitiveCases = @($primitiveListing | Where-Object { $_ -match ': test$' })
          if ($primitiveCases.Count -ne 12) { throw "Expected all 12 native rename-guard cases; found $($primitiveCases.Count)" }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib rename_guard_tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listing = cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-rename --test windows_rename -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @($listing | Where-Object { $_ -match ': test$' })
          if ($cases.Count -ne 7) { throw "Expected all 7 owned Windows rename driver cases; found $($cases.Count)" }
          cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-rename --test windows_rename -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 test --locked -p sorter-executor --features experimental-windows-rename
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint inspected CLI execution protocol
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          cargo +1.99.0 clippy --locked -p sorter-cli --features selected-windows-execution --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise inspected CLI execution protocol on owned Windows files
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          cargo +1.99.0 test --locked -p sorter-cli --features selected-windows-execution --test run_files -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $legacy = cargo +1.99.0 test --locked -p sorter-cli --features selected-windows-execution --test legacy -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $legacyCases = @($legacy | Where-Object { $_ -match ': test$' })
          if ($legacyCases.Count -ne 10) { throw "Expected all 10 legacy CLI product cases; found $($legacyCases.Count)" }
          cargo +1.99.0 test --locked -p sorter-cli --features selected-windows-execution --test legacy -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint selected Windows multi-file jobs
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          cargo +1.99.0 clippy --locked -p sorter-executor --features selected-windows-execution --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise selected Windows root safety
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          $roots = cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --test windows_selected_roots -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($roots | Where-Object { $_ -match ': test$' }).Count -ne 12) { throw "Expected 12 selected-root cases" }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --test windows_selected_roots -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib selected_directory_uncertainty_tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise selected Windows multi-file job safety
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          $jobs = cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --test windows_selected_job -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($jobs | Where-Object { $_ -match ': test$' }).Count -ne 8) { throw "Expected 8 selected-job cases" }
          cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test staged MP3 repair and retained-original adapter
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $tags = cargo +1.99.0 test --locked -p sorter-io --test staged_tags -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($tags | Where-Object { $_ -match ': test$' }).Count -ne 10) { throw "Expected 9 staged-writer cases plus native metadata roundtrip" }
          cargo +1.99.0 test --locked -p sorter-io --test staged_tags -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $repair = cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib repair_backup_tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($repair | Where-Object { $_ -match ': test$' }).Count -ne 20) { throw "Expected 20 retained-original preservation cases" }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib repair_backup_tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test selected Windows FixNames jobs
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $repairBounds = cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --lib journal_budget_tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($repairBounds | Where-Object { $_ -match ': test$' }).Count -ne 4) { throw "Expected 4 repair journal/classification/path boundary cases" }
          cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --lib journal_budget_tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $repairJobs = cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --test windows_repair -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($repairJobs | Where-Object { $_ -match ': test$' }).Count -ne 37) { throw "Expected 13 original, 13 FLAC and 11 Ogg product FixNames cases" }
          cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --test windows_repair -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require Ogg stream and native reader plus actual decoder gates
        if: ${{ !cancelled() }}
        run: |
          $listing = cargo +1.99.0 test --locked -p sorter-io --test staged_ogg -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($listing | Where-Object { $_ -match ': test$' }).Count -ne 17) { throw "Expected all 17 Ogg stream/native/decoder cases" }
          $cases = @('real_native_reader_roundtrip_matches_five_ogg_assignments_and_track', 'ffmpeg_decodes_real_staged_vorbis_and_opus_to_identical_pcm')
          foreach ($case in $cases) {
            $exact = cargo +1.99.0 test --locked -p sorter-io --test staged_ogg $case -- --exact --list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (@($exact | Where-Object { $_ -eq "${case}: test" }).Count -ne 1) { throw "Missing mandatory Ogg case: $case" }
            cargo +1.99.0 test --locked -p sorter-io --test staged_ogg $case -- --exact --test-threads=1 --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo +1.99.0 test --locked -p sorter-io --test staged_ogg -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require exact Ogg product dispatch and Windows preservation cases
        if: ${{ !cancelled() }}
        run: |
          $dispatch = cargo +1.99.0 test --locked -p sorter-io --test staged_ogg_dispatch -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($dispatch | Where-Object { $_ -match ': test$' }).Count -ne 3) { throw "Expected all 3 Ogg dispatch cases" }
          cargo +1.99.0 test --locked -p sorter-io --test staged_ogg_dispatch -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            $cases = @(
              'real_taglib_provider_plans_rebinds_and_publishes_vorbis_growth',
              'real_taglib_provider_plans_rebinds_and_publishes_opus_duplicate_shrink',
              'duplicate_five_field_ogg_repairs_preserve_artwork_and_exact_backup',
              'unchanged_ogg_tags_keep_identity_without_stage_or_backup',
              'corrupt_crc_truncation_chaining_and_multiplexing_retain_filename_only',
              'cancellation_during_ogg_stage_preserves_original_and_forbids_replay',
              'cancellation_and_lost_backup_response_keep_grown_stage_and_original_lengths',
              'lost_publication_response_reopens_grown_and_shorter_replacements',
              'rehashed_oversize_inconsistent_lengths_hashes_and_v1_downgrade_are_rejected',
              'coherent_rehashed_wrong_replacement_size_never_verifies_current_artifact',
              'foreign_collision_after_backup_preserves_grown_stage_and_exact_original'
            )
            foreach ($case in $cases) {
              $exact = "ogg::$case"
              $listing = cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --test windows_repair $exact -- --exact --list
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if (@($listing | Where-Object { $_ -eq "${exact}: test" }).Count -ne 1) { throw "Missing exact Ogg product case: $exact" }
              cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --test windows_repair $exact -- --exact --test-threads=1 --nocapture
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Require FLAC stream dispatch and native metadata roundtrip
        if: ${{ !cancelled() }}
        run: |
          $listing = cargo +1.99.0 test --locked -p sorter-io --test staged_flac -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($listing | Where-Object { $_ -match ': test$' }).Count -ne 14) { throw "Expected all 14 FLAC stream/dispatch/native cases" }
          $nativeCase = 'real_native_reader_roundtrip_matches_all_five_assignments_and_untouched_track'
          $nativeListing = cargo +1.99.0 test --locked -p sorter-io --test staged_flac $nativeCase -- --exact --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($nativeListing | Where-Object { $_ -eq "${nativeCase}: test" }).Count -ne 1) { throw "Native FLAC bridge roundtrip must not be compiled out" }
          cargo +1.99.0 test --locked -p sorter-io --test staged_flac $nativeCase -- --exact --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 test --locked -p sorter-io --test staged_flac -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require each exact Windows FLAC product and length-binding case
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          $cases = @(
            'five_fields_shrink_preserves_picture_vendor_unknowns_audio_and_exact_backup',
            'unchanged_flac_tags_keep_identity_without_stage_or_backup',
            'opaque_application_and_reserved_blocks_reject_shift_after_filename_repair',
            'equal_length_flac_repair_keeps_opaque_block_bytes',
            'cancellation_during_flac_stage_preserves_original_and_forbids_replay',
            'cancellation_and_lost_backup_response_keep_distinct_original_and_stage_lengths',
            'lost_publication_response_reopens_with_replacement_length_and_original_backup',
            'rehashed_original_replacement_length_or_hash_substitution_is_rejected',
            'coherent_rehashed_wrong_sizes_and_foreign_identical_bytes_never_verify',
            'legacy_v1_mp3_journal_reopens_without_new_evidence_or_rewriting_bytes',
            'v1_journal_cannot_claim_v2_length_changing_evidence',
            'foreign_collision_after_backup_never_overwrites_or_loses_shorter_stage',
            'real_taglib_provider_plans_rebinds_and_publishes_five_flac_fields'
          )
          foreach ($case in $cases) {
            $exact = "flac::$case"
            $listing = cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --test windows_repair $exact -- --exact --list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (@($listing | Where-Object { $_ -eq "${exact}: test" }).Count -ne 1) { throw "Missing exact FLAC product case: $exact" }
            cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --test windows_repair $exact -- --exact --test-threads=1 --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test bounded album planning reads
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $cases = cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib album_bounded_ -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($cases | Where-Object { $_ -match ": test$" }).Count -ne 8) { throw "Expected 8 cases for --lib album_bounded_" }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib album_bounded_ -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --test windows_album_reads -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($cases | Where-Object { $_ -match ": test$" }).Count -ne 5) { throw "Expected 5 cases for --test windows_album_reads" }
          cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --test windows_album_reads -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test acknowledged directory summary boundary
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $cases = cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --lib directory_receipt_tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($cases | Where-Object { $_ -match ": test$" }).Count -ne 1) { throw "Expected 1 directory receipt boundary case" }
          cargo +1.99.0 test --locked -p sorter-executor --features selected-windows-execution --lib directory_receipt_tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test preview-bound copied Move stream evidence
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $cases = cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib move_stream_ -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($cases | Where-Object { $_ -match ": test$" }).Count -ne 21) { throw "Expected 21 copied Move stream inventory/copy/retirement/read-only cases" }
          cargo +1.99.0 test --locked -p sorter-io --features experimental-windows-mutation --lib move_stream_ -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test preview-bound copied Move job and journal contracts
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
